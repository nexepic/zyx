name: Rust Bindings

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rust-bindings.yml'
      - 'bindings/rust/**'
      - 'scripts/package_rust_crates.py'
      - 'tests/test_package_rust_crates.py'
      - 'Cargo.toml'
      - 'crates/zyx-src/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'conanfile.py'
      - 'include/**'
      - 'src/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rust-bindings.yml'
      - 'bindings/rust/**'
      - 'scripts/package_rust_crates.py'
      - 'tests/test_package_rust_crates.py'
      - 'Cargo.toml'
      - 'crates/zyx-src/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'conanfile.py'
      - 'include/**'
      - 'src/**'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: clang-20
            cxx: clang++-20
          - os: macos-latest
          - os: windows-latest
            cc: clang-cl
            cxx: clang-cl

    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install conan ninja

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository --no-update -y universe
          sudo apt-get -o Acquire::Retries=3 -o APT::Update::Error-Mode=any update
          sudo apt-get -o Acquire::Retries=3 install -y clang-20 llvm-20 libc++-20-dev libc++abi-20-dev

      - name: Install pkg-config (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install pkgconfiglite --allow-empty-checksums
          echo "C:\Program Files\pkgconfiglite\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install llvm --version=22.1.8 --force
          echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: Install Conan dependencies (Unix)
        if: runner.os != 'Windows'
        run: |
          conan profile detect
          conan install . --output-folder=buildDir --build=missing --build="antlr4-cppruntime/*" -s build_type=Release -s compiler.cppstd=20 -o with_tests=False
        env:
          CC: ${{ matrix.cc || '' }}
          CXX: ${{ matrix.cxx || '' }}

      - name: Install Conan dependencies (Windows)
        if: runner.os == 'Windows'
        run: pwsh scripts/install_conan_windows.ps1 Release -o with_tests=False

      - name: Build native Driver ABI library
        run: |
          cmake -S . -B buildDir -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=buildDir/conan_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DZYX_BUILD_TESTS=OFF \
            -DZYX_BUILD_APPS=OFF \
            -DZYX_BUILD_PYTHON=OFF
          cmake --build buildDir --target zyx
        shell: bash
        env:
          CC: ${{ matrix.cc || '' }}
          CXX: ${{ matrix.cxx || '' }}

      - name: Add native library to PATH (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "${{ github.workspace }}\buildDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "${{ github.workspace }}\buildDir\Release" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      # These binding contract tests each open independent databases. Isolate
      # their process-wide admission budgets: 64 MiB cache per database shares
      # a 512 MiB process limit with 16 MiB protected maintenance headroom.
      # Native concurrency tests remain separate; this does not repair or
      # validate concurrent admission behavior.
      - name: Run Rust tests
        run: cargo test --manifest-path bindings/rust/Cargo.toml --workspace --no-default-features --features system -- --test-threads=1
        env:
          ZYX_LIB_DIR: ${{ github.workspace }}/buildDir


      - name: Test Rust package staging
        if: runner.os == 'Linux'
        run: python -m unittest discover -s tests -p test_package_rust_crates.py

      - name: Package and verify unpublished crates together
        if: runner.os == 'Linux'
        run: python scripts/package_rust_crates.py --output dist --lib-dir buildDir

      - name: Upload verified crate artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: rust-crates
          path: dist/*.crate
          if-no-files-found: error

  package:
    name: Package crates
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified crate artifacts
        uses: actions/download-artifact@v8
        with:
          name: rust-crates
          path: dist

      - name: Upload crates to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.crate
