name: Optimization Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Release benchmark on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: clang-20
            cxx: clang++-20
          - os: windows-latest
          - os: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install common tools
        run: python -m pip install --disable-pip-version-check conan ninja

      - name: Install LLVM (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo apt-add-repository "deb http://apt.llvm.org/$(lsb_release -sc)/ llvm-toolchain-$(lsb_release -sc)-20 main"
          sudo apt update
          sudo apt install -y clang-20 llvm-20 libc++-20-dev libc++abi-20-dev
        shell: bash

      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install llvm --version=20.1.4 --force
          "C:\\Program Files\\LLVM\\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: pwsh scripts/install_conan_windows.ps1 Release
        shell: pwsh
        env:
          CONAN_OUTPUT_DIR: build-benchmark

      - name: Install dependencies (Unix)
        if: runner.os != 'Windows'
        run: |
          conan profile detect --force
          conan install . --output-folder=build-benchmark --build=missing --build="antlr4-cppruntime/*" -s build_type=Release -s compiler.cppstd=20
        shell: bash
        env:
          CC: ${{ matrix.cc || '' }}
          CXX: ${{ matrix.cxx || '' }}

      - name: Configure and build Release benchmark
        run: |
          cmake -S . -B build-benchmark -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=build-benchmark/conan_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DZYX_BUILD_TESTS=OFF \
            -DZYX_BUILD_APPS=ON \
            -DZYX_ENABLE_COVERAGE=OFF
          cmake --build build-benchmark --target zyx_compare_bench
        shell: bash
        env:
          CC: ${{ matrix.cc || '' }}
          CXX: ${{ matrix.cxx || '' }}

      - name: Run reproducible benchmark matrix
        run: |
          mkdir -p "$RUNNER_TEMP/zyx-optimization-benchmark"
          export ZYX_COMPARE_BENCH="$PWD/build-benchmark/zyx-compare-bench"
          if [ "$RUNNER_OS" = "Windows" ]; then
            export ZYX_COMPARE_BENCH="$PWD/build-benchmark/zyx-compare-bench.exe"
          fi
          export PYTHONPATH="$PWD/benchmarks/graphdb-comparison"
          export ZYX_COMPARE_EMIT_PROFILE=0
          python -m runner.matrix \
            --database zyx \
            --scale smoke \
            --scale small \
            --scale medium \
            --execution-mode cold-ish \
            --execution-mode opened \
            --execution-mode warm \
            --profile scan \
            --output-root "$RUNNER_TEMP/zyx-optimization-benchmark" \
            --warmup 0 \
            --iterations 10
        shell: bash

      - name: Validate benchmark matrix evidence
        run: |
          python - "$RUNNER_TEMP/zyx-optimization-benchmark" <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          manifests = sorted(root.glob("*-matrix.json"))
          if len(manifests) != 1:
              raise SystemExit(f"expected exactly one matrix manifest, found {len(manifests)}")
          manifest_path = manifests[0]
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          expected = {
              (scale, mode)
              for scale in ("smoke", "small", "medium")
              for mode in ("cold-ish", "opened", "warm")
          }
          actual = {(run["scale"], run["execution_mode"]) for run in manifest["runs"]}
          if actual != expected:
              raise SystemExit(f"matrix dimensions differ: expected {sorted(expected)}, got {sorted(actual)}")
          for run in manifest["runs"]:
              quality = json.loads(Path(run["quality_gates"]).read_text(encoding="utf-8"))
              if quality.get("status") != "passed" or quality.get("failure_count") != 0:
                  raise SystemExit(f"quality gates failed for {run['scale']}/{run['execution_mode']}")
          print(f"validated {len(manifest['runs'])} benchmark runs from {manifest_path}")
          PY
        shell: bash

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optimization-benchmark-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/zyx-optimization-benchmark
          if-no-files-found: warn
          retention-days: 30
