name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      stage10_endurance_repetitions:
        description: "Repeat the Stage 10 recovery/maintenance gate on every platform (0 disables it; 1-9999 are allowed)."
        required: false
        default: "0"
        type: string
      p0_bulk_edge_profile:
        description: "Run a reviewed P0 bulk-Edge calibration candidate on every platform; disabled leaves the normal smoke gate unchanged."
        required: false
        default: "disabled"
        type: choice
        options:
          - disabled
          - 1m
          - 10m
      p0_bulk_edge_hardware_label:
        description: "Reviewed hardware identity for a manual P0 calibration candidate (required when the profile is enabled)."
        required: false
        default: ""
        type: string
      p0_bulk_edge_minimum_ingest_edges_per_second:
        description: "Positive reviewed P0 throughput floor (required when the profile is enabled)."
        required: false
        default: ""
        type: string
      p0_bulk_edge_maximum_bytes_per_edge:
        description: "Positive reviewed P0 space ceiling (required when the profile is enabled)."
        required: false
        default: ""
        type: string
      p0_bulk_edge_maximum_reopen_and_scan_ms:
        description: "Positive reviewed P0 reopen-and-scan ceiling (required when the profile is enabled)."
        required: false
        default: ""
        type: string
      p0_bulk_edge_maximum_peak_rss_bytes:
        description: "Positive reviewed P0 peak-RSS ceiling in bytes (required when the profile is enabled)."
        required: false
        default: ""
        type: string
      p0_bulk_edge_maximum_scratch_candidate_segments:
        description: "Positive reviewed P0 scratch-candidate ceiling (required when the profile is enabled)."
        required: false
        default: ""
        type: string
      p0_bulk_edge_minimum_scratch_source_runs:
        description: "Positive reviewed P0 scratch source-run floor (required when the profile is enabled)."
        required: false
        default: ""
        type: string
      p0_bulk_edge_minimum_scratch_merge_passes:
        description: "Reviewed P0 scratch merge-pass floor, including zero (required when the profile is enabled)."
        required: false
        default: ""
        type: string

jobs:
  native-storage-tsan:
    name: Native storage TSan (macOS)
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Prepare diagnostic evidence
        run: |
          mkdir -p "$RUNNER_TEMP/ci-evidence"
          printf 'ZYX_CI_EVIDENCE_DIR=%s\n' "$RUNNER_TEMP/ci-evidence" >> "$GITHUB_ENV"
          # Include cold Conan/build time and the complete TSan gate; reserve
          # the final five minutes for evidence upload before the job deadline.
          printf 'ZYX_CI_DEADLINE_UNIX=%s\n' "$(( $(date +%s) + 3300 ))" >> "$GITHUB_ENV"
        shell: bash

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install Common Tools
        run: python scripts/run_ci_evidence.py --name common-tools --timeout 21600 -- pip install conan ninja "pytest>=8,<10"

      # Keep native tests running even if this additional harness check fails;
      # its own failure is made mandatory after evidence upload below.
      - name: Validate diagnostic supervisor failure paths
        id: diagnostic_tests
        continue-on-error: true
        run: |
          python scripts/run_ci_evidence.py --name diagnostic-tests --timeout 180 -- python -m pytest -q tests/test_run_ci_evidence.py tests/test_collect_ci_environment.py tests/test_run_test_process.py tests/test_run_test_tier.py tests/test_diagnose_macos_quota.py --junitxml "$ZYX_CI_EVIDENCE_DIR/diagnostic-tests/pytest.xml"
        shell: bash

      - name: Install Project Dependencies
        run: |
          python scripts/run_ci_evidence.py --name conan-profile --timeout 21600 -- conan profile detect --force
          python scripts/run_ci_evidence.py --name conan-dependencies --timeout 21600 -- conan install . --output-folder=build-tsan --build=missing --build="antlr4-cppruntime/*" -s build_type=Debug -s compiler.cppstd=20

      # Keep TSan focused on the real reader/writer/compactor paths. This makes
      # races in snapshot retention, relocation, and native positioned I/O a
      # required macOS gate without turning unrelated tests into sanitizer noise.
      - name: Configure and build native storage TSan tests
        run: |
          python scripts/run_ci_evidence.py --name configure --timeout 600 -- cmake -S . -B build-tsan -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=build-tsan/conan_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Debug \
            -DZYX_BUILD_TESTS=ON \
            -DZYX_BUILD_APPS=OFF \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
          python scripts/run_ci_evidence.py --name build --timeout 3600 -- cmake --build build-tsan --target zyx_test_suite
        shell: bash

      - name: Run native storage TSan concurrency gates
        run: |
          TSAN_OPTIONS='halt_on_error=1:second_deadlock_stack=1' \
            python scripts/run_ci_evidence.py --name tsan-gate --timeout 1800 --gtest -- ./build-tsan/zyx_test_suite \
              --gtest_filter='RelocatableCompactionWorkloadTest.*:RelocatableCompactionCoordinatorTest.*:RelocatableMaintenanceServiceTest.BoundsSpaceDuringConcurrentReadersWritersAndMaintenance:RelocatableMaintenanceServiceTest.RecoversVectorDebtWhileTheOnlyQueueSlotIsOccupied'
        shell: bash

      - name: Collect diagnostic build metadata
        if: always()
        continue-on-error: true
        run: python scripts/collect_ci_environment.py --output "$RUNNER_TEMP/ci-evidence/environment.json" --build-dir build-tsan --save-crash-symbols
        shell: bash

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics-tsan-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Require diagnostic supervisor checks
        if: ${{ always() && steps.diagnostic_tests.outcome == 'failure' }}
        run: |
          echo 'Diagnostic supervisor checks failed; inspect diagnostic-tests evidence.'
          exit 1
        shell: bash

  native-storage-asan-ubsan:
    name: Native storage ASan+UBSan (macOS)
    runs-on: macos-latest
    # Cold Conan setup and an instrumented build can consume most of 45 minutes
    # before the sanitizer test gates even start on hosted arm64 runners.
    timeout-minutes: 90

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Prepare diagnostic evidence
        run: |
          mkdir -p "$RUNNER_TEMP/ci-evidence"
          printf 'ZYX_CI_EVIDENCE_DIR=%s\n' "$RUNNER_TEMP/ci-evidence" >> "$GITHUB_ENV"
          printf 'ZYX_CI_DEADLINE_UNIX=%s\n' "$(( $(date +%s) + 5100 ))" >> "$GITHUB_ENV"
        shell: bash

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install Common Tools
        run: python scripts/run_ci_evidence.py --name common-tools --timeout 21600 -- pip install conan ninja "pytest>=8,<10"

      # Keep native tests running even if this additional harness check fails;
      # its own failure is made mandatory after evidence upload below.
      - name: Validate diagnostic supervisor failure paths
        id: diagnostic_tests
        continue-on-error: true
        run: |
          python scripts/run_ci_evidence.py --name diagnostic-tests --timeout 180 -- python -m pytest -q tests/test_run_ci_evidence.py tests/test_collect_ci_environment.py tests/test_run_test_process.py tests/test_run_test_tier.py tests/test_diagnose_macos_quota.py --junitxml "$ZYX_CI_EVIDENCE_DIR/diagnostic-tests/pytest.xml"
        shell: bash

      - name: Install Project Dependencies
        run: |
          python scripts/run_ci_evidence.py --name conan-profile --timeout 21600 -- conan profile detect --force
          python scripts/run_ci_evidence.py --name conan-dependencies --timeout 21600 -- conan install . --output-folder=build-asan-ubsan --build=missing --build="antlr4-cppruntime/*" -s build_type=Debug -s compiler.cppstd=20

      # This group covers the native publication, recovery, and compaction
      # paths under address and undefined-behavior instrumentation. macOS
      # ASan does not support leak detection, so do not request it here.
      - name: Configure and build native storage ASan+UBSan tests
        run: |
          python scripts/run_ci_evidence.py --name configure --timeout 600 -- cmake -S . -B build-asan-ubsan -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=build-asan-ubsan/conan_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Debug \
            -DZYX_BUILD_TESTS=ON \
            -DZYX_BUILD_APPS=OFF \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          python scripts/run_ci_evidence.py --name build --timeout 4800 -- cmake --build build-asan-ubsan --target zyx_test_suite
        shell: bash

      - name: Record sanitizer test discovery
        run: python scripts/run_ci_evidence.py --name discovery --timeout 120 -- ./build-asan-ubsan/zyx_test_suite --gtest_list_tests
        shell: bash

      - name: Diagnose concurrent publication with ASan+UBSan
        continue-on-error: true
        run: |
          ./build-asan-ubsan/zyx_test_suite --gtest_list_tests \
            --gtest_filter='RelocatableStorageBackendTest.BlindPropertyRebaseMergesDisjointOwnersOnOnePhysicalPage' \
            | grep -F 'BlindPropertyRebaseMergesDisjointOwnersOnOnePhysicalPage'
          ASAN_OPTIONS='halt_on_error=1:fast_unwind_on_fatal=0' UBSAN_OPTIONS='halt_on_error=1:print_stacktrace=1' \
            python scripts/run_ci_evidence.py --name asan-publication --timeout 600 --gtest -- ./build-asan-ubsan/zyx_test_suite \
              --gtest_filter='RelocatableStorageBackendTest.BlindPropertyRebaseMergesDisjointOwnersOnOnePhysicalPage'
        shell: bash

      # A separate cold process distinguishes observer overhead from the query.
      # It retains the same RSS limit and sanitizer settings; the traced run and
      # mandatory complete sanitizer gate below remain unchanged.
      - name: Diagnose cold RSS without budget or RSS observers
        continue-on-error: true
        run: |
          unset ZYX_CI_BUDGET_TRACE ZYX_CI_RSS_TRACE ZYX_CI_LAYOUT_TRACE
          ./build-asan-ubsan/zyx_test_suite --gtest_list_tests \
            --gtest_filter='RelocatableStorageBackendTest.NativeLogicalReadonlySortSpillsAndPreservesCompleteDescendingCollection' \
            | grep -F 'NativeLogicalReadonlySortSpillsAndPreservesCompleteDescendingCollection'
          ASAN_OPTIONS='halt_on_error=1:fast_unwind_on_fatal=0' UBSAN_OPTIONS='halt_on_error=1:print_stacktrace=1' \
            python scripts/run_ci_evidence.py --name asan-cold-rss-control --timeout 180 --gtest -- ./build-asan-ubsan/zyx_test_suite \
              --gtest_filter='RelocatableStorageBackendTest.NativeLogicalReadonlySortSpillsAndPreservesCompleteDescendingCollection'
        shell: bash

      - name: Diagnose RSS-guarded spill with default ASan+UBSan checks
        continue-on-error: true
        env:
          ZYX_CI_RSS_TRACE: '1'
          ZYX_CI_BUDGET_TRACE: '1'
        run: |
          ./build-asan-ubsan/zyx_test_suite --gtest_list_tests \
            --gtest_filter='RelocatableStorageBackendTest.NativeLogicalReadonlySortSpillsAndPreservesCompleteDescendingCollection' \
            | grep -F 'NativeLogicalReadonlySortSpillsAndPreservesCompleteDescendingCollection'
          ASAN_OPTIONS='halt_on_error=1:fast_unwind_on_fatal=0' UBSAN_OPTIONS='halt_on_error=1:print_stacktrace=1' \
            python scripts/run_ci_evidence.py --name asan-cold-rss --timeout 600 --gtest -- ./build-asan-ubsan/zyx_test_suite \
              --gtest_filter='RelocatableStorageBackendTest.NativeLogicalReadonlySortSpillsAndPreservesCompleteDescendingCollection'
        shell: bash

      # Independent processes reset diagnostic caps for every known failed case.
      # These additional runs never replace the complete sanitizer gate.
      - name: Diagnose sanitizer admission cases
        continue-on-error: true
        env:
          ZYX_CI_RSS_TRACE: '1'
          ZYX_CI_BUDGET_TRACE: '1'
          ASAN_OPTIONS: 'halt_on_error=1:fast_unwind_on_fatal=0'
          UBSAN_OPTIONS: 'halt_on_error=1:print_stacktrace=1'
        run: python scripts/run_ci_evidence.py --name asan-budget-cases --timeout 1500 -- python scripts/diagnose_ci_budget_cases.py --binary build-asan-ubsan/zyx_test_suite --platform asan
        shell: bash

      - name: Run native storage ASan+UBSan gates
        env:
          ZYX_CI_RSS_TRACE: '1'
          ZYX_CI_BUDGET_TRACE: '1'
        run: |
          ASAN_OPTIONS='halt_on_error=1:fast_unwind_on_fatal=0' UBSAN_OPTIONS='halt_on_error=1:print_stacktrace=1' \
            python scripts/run_ci_evidence.py --name asan-gate --timeout 3600 --gtest -- ./build-asan-ubsan/zyx_test_suite \
              --gtest_filter='ScopedScalarReadValueTest.*:ResultPropertyMapAdmissionTest.*:NativeTransactionTest.*:RelocatableStorageBackendTest.*:RelocatableCompactionWorkloadTest.*:RelocatableCompactionCoordinatorTest.*:RelocatableMaintenanceServiceTest.*:RelocatableProcessCrashGraphWriteTest.*:RelocatableProcessCrashLargeValueTest.*:RelocatableProcessCrashVectorTest.*:RelocatableProcessCrashBTreeTest.*'
        shell: bash

      - name: Collect diagnostic build metadata
        if: always()
        continue-on-error: true
        run: python scripts/collect_ci_environment.py --output "$RUNNER_TEMP/ci-evidence/environment.json" --build-dir build-asan-ubsan --save-crash-symbols
        shell: bash

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics-asan-ubsan-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Require diagnostic supervisor checks
        if: ${{ always() && steps.diagnostic_tests.outcome == 'failure' }}
        run: |
          echo 'Diagnostic supervisor checks failed; inspect diagnostic-tests evidence.'
          exit 1
        shell: bash

  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: clang-20
            cxx: clang++-20
            llvm_cov: llvm-cov-20
            llvm_profdata: llvm-profdata-20
          - os: windows-latest
            cc: clang-cl
            cxx: clang-cl
            llvm_cov: llvm-cov
            llvm_profdata: llvm-profdata
          - os: macos-latest
            llvm_cov: llvm-cov
            llvm_profdata: llvm-profdata

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Prepare diagnostic evidence
        run: |
          mkdir -p "$RUNNER_TEMP/ci-evidence"
          printf 'ZYX_CI_EVIDENCE_DIR=%s\n' "$RUNNER_TEMP/ci-evidence" >> "$GITHUB_ENV"
          printf 'ZYX_CI_DEADLINE_UNIX=%s\n' "$(( $(date +%s) + 21300 ))" >> "$GITHUB_ENV"
        shell: bash

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install Common Tools
        run: python scripts/run_ci_evidence.py --name common-tools --timeout 21600 -- pip install conan ninja "pytest>=8,<10"

      # Keep native tests running even if this additional harness check fails;
      # its own failure is made mandatory after evidence upload below.
      - name: Validate diagnostic supervisor failure paths
        id: diagnostic_tests
        continue-on-error: true
        run: |
          python scripts/run_ci_evidence.py --name diagnostic-tests --timeout 180 -- python -m pytest -q tests/test_run_ci_evidence.py tests/test_collect_ci_environment.py tests/test_run_test_process.py tests/test_run_test_tier.py tests/test_diagnose_macos_quota.py --junitxml "$ZYX_CI_EVIDENCE_DIR/diagnostic-tests/pytest.xml"
        shell: bash

      - name: Diagnose fresh string allocations (macOS)
        if: runner.os == 'macOS'
        run: |
          python scripts/run_ci_evidence.py --name string-probe-build --timeout 300 -- clang++ -std=c++20 -O0 scripts/diagnose_string_allocations.cpp -o "$RUNNER_TEMP/zyx-string-alloc-diagnostic"
          python scripts/run_ci_evidence.py --name string-allocations --timeout 300 -- "$RUNNER_TEMP/zyx-string-alloc-diagnostic"

      - name: Install System Deps (Linux)
        if: runner.os == 'Linux'
        run: |
          python scripts/run_ci_evidence.py --name apt-repository --timeout 21600 -- sudo add-apt-repository -y universe
          python scripts/run_ci_evidence.py --name apt-update --timeout 21600 -- sudo apt-get update
          python scripts/run_ci_evidence.py --name apt-install --timeout 21600 -- sudo apt-get install -y clang-20 llvm-20 libc++-20-dev libc++abi-20-dev

      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        run: |
          python scripts/run_ci_evidence.py --name llvm-install --timeout 21600 -- choco install llvm --version=20.1.4 --force
          echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: Install Project Dependencies (Conan) (Windows)
        if: runner.os == 'Windows'
        run: python scripts/run_ci_evidence.py --name conan-dependencies --timeout 21600 -- pwsh scripts/install_conan_windows.ps1 Debug

      - name: Install Project Dependencies (Conan) (Unix)
        if: runner.os != 'Windows'
        run: |
          python scripts/run_ci_evidence.py --name conan-profile --timeout 21600 -- conan profile detect
          python scripts/run_ci_evidence.py --name conan-dependencies --timeout 21600 -- conan install . --output-folder=buildDir --build=missing --build="antlr4-cppruntime/*" -s build_type=Debug -s compiler.cppstd=20
        env:
          CC: ${{ matrix.cc || '' }}
          CXX: ${{ matrix.cxx || '' }}

      - name: Configure and Build
        run: |
          python scripts/run_ci_evidence.py --name configure --timeout 600 -- cmake -S . -B buildDir -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=buildDir/conan_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Debug \
            -DZYX_BUILD_TESTS=ON \
            -DZYX_BUILD_APPS=ON \
            -DZYX_ENABLE_COVERAGE=ON
          python scripts/run_ci_evidence.py --name build --timeout 7200 -- cmake --build buildDir --target zyx_test_suite
        shell: bash
        env:
          CC: ${{ matrix.cc || '' }}
          CXX: ${{ matrix.cxx || '' }}

      # Keep the reports and test transcripts outside the build directory so
      # every platform can upload one self-contained Stage 10 audit artifact.
      - name: Diagnose Windows fresh string allocations
        if: runner.os == 'Windows'
        continue-on-error: true
        env:
          MSYS_NO_PATHCONV: '1'
        run: |
          python scripts/run_ci_evidence.py --name string-probe-build --timeout 300 -- clang-cl /nologo /std:c++20 /EHsc /Od /MDd scripts/diagnose_string_allocations.cpp /FebuildDir/zyx-string-alloc.exe
          python scripts/run_ci_evidence.py --name string-allocations --timeout 300 -- ./buildDir/zyx-string-alloc.exe
        shell: bash

      - name: Prepare Stage 10 evidence directory
        run: |
          evidence_dir="$RUNNER_TEMP/stage10-evidence"
          mkdir -p "$evidence_dir"
          printf 'ZYX_STAGE10_EVIDENCE_DIR=%s\n' "$evidence_dir" >> "$GITHUB_ENV"
        shell: bash

      # Copy the manual input into the shared job environment only after
      # validating it. Later evidence collection must record the same value
      # that controlled the actual Google Test endurance invocation.
      - name: Record Stage 10 endurance configuration
        env:
          STAGE10_WORKFLOW_INPUT: ${{ inputs.stage10_endurance_repetitions }}
        run: |
          repetitions=0
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
            repetitions="$STAGE10_WORKFLOW_INPUT"
          fi
          case "$repetitions" in
            ''|*[!0-9]*) echo "stage10_endurance_repetitions must be decimal digits" >&2; exit 2 ;;
          esac
          if [ "${#repetitions}" -gt 4 ] || [ "$repetitions" -gt 9999 ]; then
            echo "stage10_endurance_repetitions must be between 0 and 9999" >&2
            exit 2
          fi
          printf 'ZYX_STAGE10_ENDURANCE_REPETITIONS=%s\n' "$repetitions" >> "$GITHUB_ENV"
        shell: bash

      - name: Record enabled test discovery
        run: python scripts/run_ci_evidence.py --name discovery --timeout 120 -- buildDir/zyx_test_suite --gtest_list_tests
        shell: bash

      # Diagnostics are additional to, and cannot replace, the normal unit gate.
      - name: Diagnose Windows ingest failures
        if: runner.os == 'Windows'
        continue-on-error: true
        run: |
          python scripts/run_ci_evidence.py --name windows-ingest --timeout 1800 --gtest -- buildDir/zyx_test_suite.exe --gtest_filter='RelocatableDriverAbiIngestTest.StreamedIngestRebasesOverASameOwnerEdgePublication:RelocatableDriverAbiIngestRebaseCorruptionTest.StreamedPublicationConflictRollsBackAndReleasesScratch'
        shell: bash

      - name: Diagnose Windows plan cache failures
        if: runner.os == 'Windows'
        continue-on-error: true
        run: |
          python scripts/run_ci_evidence.py --name windows-plan-cases --timeout 1200 -- python scripts/diagnose_test_cases.py --binary buildDir/zyx_test_suite.exe --source tests/src/query/cache/test_PlanCache.cpp --suite PlanCacheTest
        shell: bash

      - name: Diagnose Windows read session termination
        if: runner.os == 'Windows'
        continue-on-error: true
        env:
          ZYX_CI_CASE_TRACE: '1'
          ZYX_CI_BUDGET_TRACE: '1'
        run: |
          python scripts/run_ci_evidence.py --name windows-read-session-cases --timeout 2400 -- python scripts/diagnose_test_cases.py --binary buildDir/zyx_test_suite.exe --source tests/src/storage/relocatable/entity/test_NativeReadSessionTokenBudget.cpp --suite NativeReadSessionTokenBudgetTest
        shell: bash

      - name: Diagnose Windows projection binding allocation failures
        if: runner.os == 'Windows'
        continue-on-error: true
        env:
          ZYX_CI_BUDGET_TRACE: '1'
        run: |
          python scripts/run_ci_evidence.py --name windows-projection-binding-cases --timeout 1200 -- python scripts/diagnose_test_cases.py --binary buildDir/zyx_test_suite.exe --source tests/src/query/execution/test_BoundProjectionReferences.cpp --suite BoundProjectionReferencesTest
        shell: bash

      - name: Diagnose Windows slot allocation failures
        if: runner.os == 'Windows'
        continue-on-error: true
        env:
          ZYX_CI_BUDGET_TRACE: '1'
        run: |
          python scripts/run_ci_evidence.py --name windows-slot-binding-cases --timeout 1200 -- python scripts/diagnose_test_cases.py --binary buildDir/zyx_test_suite.exe --source tests/src/query/execution/test_BoundSlotRegistry.cpp --suite BoundSlotRegistryTest
        shell: bash

      # These additional, bounded diagnostics cannot replace the unit gate.
      # Each process has its own capped rejection trace; no data values are logged.
      - name: Diagnose Windows materialization budgets
        if: runner.os == 'Windows'
        continue-on-error: true
        env:
          ZYX_CI_BUDGET_TRACE: '1'
          ZYX_CI_LAYOUT_TRACE: '1'
        run: |
          python scripts/run_ci_evidence.py --name windows-budget-cases --timeout 4000 -- python scripts/diagnose_ci_budget_cases.py --binary buildDir/zyx_test_suite.exe --platform windows
        shell: bash

      - name: Diagnose macOS materialization budgets
        if: runner.os == 'macOS'
        continue-on-error: true
        env:
          ZYX_CI_BUDGET_TRACE: '1'
        run: |
          python scripts/run_ci_evidence.py --name macos-budget-cases --timeout 4000 -- python scripts/diagnose_ci_budget_cases.py --binary buildDir/zyx_test_suite --platform macos
        shell: bash

      - name: Locate the macOS conversion quota rejection
        if: runner.os == 'macOS'
        continue-on-error: true
        env:
          ZYX_CI_BUDGET_TRACE: '1'
        run: |
          python scripts/run_ci_evidence.py --name macos-conversion-quota-stack --timeout 300 --gtest -- python scripts/diagnose_macos_quota.py --binary buildDir/zyx_test_suite
        shell: bash

      - name: Run Unit Tests
        id: unit_tests
        run: |
          export LLVM_PROFILE_FILE="$PWD/buildDir/code-%p.profraw"
          ZYX_CI_CASE_TRACE=1 python scripts/run_ci_evidence.py --name unit --timeout 3660 -- python scripts/run_test_tier.py unit --binary buildDir/zyx_test_suite --xml-dir "$ZYX_CI_EVIDENCE_DIR/unit/xml" --failure-log-dir "$ZYX_CI_EVIDENCE_DIR/unit/shards"
        shell: bash

      # Preserve the original large-scale correctness and recovery contracts as
      # an explicit gate; a smaller unit case does not replace these checks.
      - name: Run storage stress gates
        if: ${{ !cancelled() && steps.unit_tests.outcome != 'skipped' }}
        run: |
          export LLVM_PROFILE_FILE="$PWD/buildDir/stress-%p.profraw"
          python scripts/run_ci_evidence.py --name stress --timeout 3660 -- python scripts/run_test_tier.py stress --binary buildDir/zyx_test_suite --xml-dir "$ZYX_CI_EVIDENCE_DIR/stress/xml" --failure-log-dir "$ZYX_CI_EVIDENCE_DIR/stress/shards"
        shell: bash

      # Keep the storage-format cutover visible as an explicit cross-platform
      # gate instead of relying on its tests being buried in the full suite.
      - name: Run native format lifecycle gates
        run: |
          export LLVM_PROFILE_FILE="$PWD/buildDir/stage10-%p.profraw"
          set -o pipefail
          python scripts/run_ci_evidence.py --name lifecycle --timeout 21600 --gtest -- ./buildDir/zyx_test_suite --gtest_filter='RelocatableStorageBackendTest.*:RelocatableDriverAbiIngestTest.*:DriverAbiLifecycleTest.*' 2>&1 | tee "$ZYX_STAGE10_EVIDENCE_DIR/native-lifecycle.log"
        shell: bash

      # These deterministic lifecycle tests are repeated to catch state that
      # leaks across reopen, snapshot, compaction, and maintenance cycles.
      - name: Repeat Stage 10 recovery and maintenance gates
        run: |
          export LLVM_PROFILE_FILE="$PWD/buildDir/stage10-recovery-%p.profraw"
          set -o pipefail
          python scripts/run_ci_evidence.py --name recovery-maintenance --timeout 21600 --gtest -- ./buildDir/zyx_test_suite --gtest_filter='RelocatableCompactionWorkloadTest.*:RelocatablePageCompactionSchedulerTest.*:RelocatableSegmentRelocationSchedulerTest.*:RelocatableMixedRelocationRecoveryTest.*:BootstrapWriteBoundaries/RelocatableRelocationBootstrapBoundaryTest.*:PublicationBoundaries/RelocatableRelocatedSourceReleaseRecoveryTest.*:RelocatableMaintenanceServiceTest.BoundsSpaceDuringConcurrentReadersWritersAndMaintenance' --gtest_repeat=5 --gtest_break_on_failure 2>&1 | tee "$ZYX_STAGE10_EVIDENCE_DIR/recovery-maintenance.log"
        shell: bash

      - name: Run requested Stage 10 endurance gate
        run: |
          if [ "$ZYX_STAGE10_ENDURANCE_REPETITIONS" -eq 0 ]; then
            echo 'Stage 10 manual endurance gate is disabled for this run.'
            exit 0
          fi
          export LLVM_PROFILE_FILE="$PWD/buildDir/stage10-endurance-%p.profraw"
          set -o pipefail
          python scripts/run_ci_evidence.py --name endurance --timeout 21600 --gtest -- ./buildDir/zyx_test_suite --gtest_filter='RelocatableCompactionWorkloadTest.*:RelocatablePageCompactionSchedulerTest.*:RelocatableSegmentRelocationSchedulerTest.*:RelocatableMixedRelocationRecoveryTest.*:BootstrapWriteBoundaries/RelocatableRelocationBootstrapBoundaryTest.*:PublicationBoundaries/RelocatableRelocatedSourceReleaseRecoveryTest.*:RelocatableMaintenanceServiceTest.BoundsSpaceDuringConcurrentReadersWritersAndMaintenance' --gtest_repeat="$ZYX_STAGE10_ENDURANCE_REPETITIONS" --gtest_break_on_failure 2>&1 | tee "$ZYX_STAGE10_EVIDENCE_DIR/endurance.log"
        shell: bash

      # This validates the single-file report schema, threshold-enforcement
      # plumbing, and native build/reopen/search path. The tiny fixture fully
      # refines its bounded candidate set, so it also requires exact Recall@1.
      # Its permissive resource limits are not a production baseline.
      - name: Run native storage calibration smoke pipeline
        run: |
          cmake --build buildDir --target zyx_vector_build_calibrate zyx_vector_calibrate zyx_large_value_calibrate zyx_bulk_edge_calibrate
          calibration_dir="$ZYX_STAGE10_EVIDENCE_DIR"
          vector_data_path="$calibration_dir/vector-calibration.zyx"
          large_value_data_path="$calibration_dir/large-value-calibration.zyx"
          bulk_edge_data_path="$calibration_dir/bulk-edge-calibration.zyx"
          build_report="$calibration_dir/build-report.json"
          query_report="$calibration_dir/query-report.json"
          large_value_report="$calibration_dir/large-value-report.json"
          bulk_edge_report="$calibration_dir/bulk-edge-report.json"
          python scripts/run_ci_evidence.py --name calibration-vector-build --timeout 21600 -- ./buildDir/zyx-vector-build-calibrate --data "$vector_data_path" --vectors tests/fixtures/vector_calibration/smoke-vectors.tsv --output "$build_report" --database-id 1001 --index calibration_embedding --label CalibrationVector --property embedding --pq-subspaces 2 --pq-centroids 2 --adjacency-degree 3 --adjacency-search-budget 8 --dataset-label vector-calibration-smoke-v1 --hardware-label ci-smoke-not-baseline --enforce-gates --minimum-build-vectors-per-second 0.000001 --maximum-bytes-per-vector 1000000000000 --maximum-submitted-write-amplification 1000000000000 --maximum-file-growth-amplification 1000000000000 --maximum-peak-rss-bytes 1099511627776
          python scripts/run_ci_evidence.py --name calibration-vector-query --timeout 21600 -- ./buildDir/zyx-vector-calibrate --data "$vector_data_path" --queries tests/fixtures/vector_calibration/smoke-queries.tsv --output "$query_report" --index calibration_embedding --top-k 1 --warmup 0 --iterations 1 --candidate-search-budget 8 --refinement-budget 8 --dataset-label vector-calibration-smoke-v1 --hardware-label ci-smoke-not-baseline --enforce-gates --minimum-recall-at-k 1.0 --maximum-p50-latency-us 1000000000000 --maximum-p95-latency-us 1000000000000 --maximum-p99-latency-us 1000000000000 --maximum-peak-rss-bytes 1099511627776
          python scripts/run_ci_evidence.py --name calibration-large-value --timeout 21600 -- ./buildDir/zyx-large-value-calibrate --data "$large_value_data_path" --output "$large_value_report" --database-id 1002 --dataset-label large-value-calibration-smoke-v1 --hardware-label ci-smoke-not-baseline --unique-values 4 --value-bytes 8192 --duplicate-passes 1 --range-offset 128 --range-bytes 1024 --range-iterations 1 --maximum-physical-slot 1000 --enforce-gates --minimum-unique-writes-per-second 0.000001 --minimum-dedup-hit-rate 0.000001 --maximum-range-p95-latency-us 1000000000000 --maximum-space-amplification 1000000000000 --maximum-peak-rss-bytes 1099511627776
          python scripts/run_ci_evidence.py --name calibration-bulk-edge --timeout 21600 -- ./buildDir/zyx-bulk-edge-calibrate --data "$bulk_edge_data_path" --output "$bulk_edge_report" --edge-count 100 --dataset-label bulk-edge-calibration-smoke-v1 --hardware-label ci-smoke-not-baseline --include-trace-phases --enforce-gates --minimum-ingest-edges-per-second 0.000001 --maximum-bytes-per-edge 1000000000000 --maximum-reopen-and-scan-ms 1000000000000 --maximum-peak-rss-bytes 1099511627776 --maximum-scratch-candidate-segments 1000000000000 --minimum-scratch-source-runs 1 --minimum-scratch-merge-passes 0
          python -c 'import json, sys; build = json.load(open(sys.argv[1], encoding="utf-8")); query = json.load(open(sys.argv[2], encoding="utf-8")); large_value = json.load(open(sys.argv[3], encoding="utf-8")); bulk_edge = json.load(open(sys.argv[4], encoding="utf-8")); assert build["schema_version"] == 2 and build["gate"]["enforced"] and build["gate"]["passed"]; assert query["schema_version"] == 2 and query["all_measured_searches_used_adjacency"] and query["all_measured_searches_used_pq"] and query["gate"]["enforced"] and query["gate"]["passed"]; assert large_value["schema_version"] == 1 and large_value["storage"]["single_file"] and large_value["gate"]["enforced"] and large_value["gate"]["passed"]; assert bulk_edge["schema_version"] == 3 and bulk_edge["storage"]["single_file"] and bulk_edge["scratch"]["candidate_segments"] > 0 and bulk_edge["scratch"]["source_run_count"] >= 1 and bulk_edge["gate"]["enforced"] and bulk_edge["gate"]["passed"]' "$build_report" "$query_report" "$large_value_report" "$bulk_edge_report"
        shell: bash

      # Production thresholds are deliberately manual inputs: a hosted-runner
      # smoke result must never become a P0 baseline by accident. The tool
      # itself rejects missing, malformed, or incomplete gate arguments.
      - name: Run reviewed P0 bulk-Edge calibration candidate
        if: github.event_name == 'workflow_dispatch' && inputs.p0_bulk_edge_profile != 'disabled'
        env:
          P0_PROFILE: ${{ inputs.p0_bulk_edge_profile }}
          P0_HARDWARE_LABEL: ${{ inputs.p0_bulk_edge_hardware_label }}
          P0_MINIMUM_INGEST_EDGES_PER_SECOND: ${{ inputs.p0_bulk_edge_minimum_ingest_edges_per_second }}
          P0_MAXIMUM_BYTES_PER_EDGE: ${{ inputs.p0_bulk_edge_maximum_bytes_per_edge }}
          P0_MAXIMUM_REOPEN_AND_SCAN_MS: ${{ inputs.p0_bulk_edge_maximum_reopen_and_scan_ms }}
          P0_MAXIMUM_PEAK_RSS_BYTES: ${{ inputs.p0_bulk_edge_maximum_peak_rss_bytes }}
          P0_MAXIMUM_SCRATCH_CANDIDATE_SEGMENTS: ${{ inputs.p0_bulk_edge_maximum_scratch_candidate_segments }}
          P0_MINIMUM_SCRATCH_SOURCE_RUNS: ${{ inputs.p0_bulk_edge_minimum_scratch_source_runs }}
          P0_MINIMUM_SCRATCH_MERGE_PASSES: ${{ inputs.p0_bulk_edge_minimum_scratch_merge_passes }}
        run: |
          case "$P0_PROFILE" in
            1m) p0_edge_count=1000000 ;;
            10m) p0_edge_count=10000000 ;;
            *) echo 'p0_bulk_edge_profile must be 1m or 10m when enabled' >&2; exit 2 ;;
          esac
          if [ -z "$P0_HARDWARE_LABEL" ]; then
            echo 'p0_bulk_edge_hardware_label is required for a P0 calibration candidate' >&2
            exit 2
          fi
          p0_dir="$ZYX_STAGE10_EVIDENCE_DIR/p0-bulk-edge-${P0_PROFILE}"
          mkdir -p "$p0_dir"
          cmake --build buildDir --target zyx_bulk_edge_calibrate
          python scripts/run_ci_evidence.py --name p0-bulk-edge --timeout 21600 -- ./buildDir/zyx-bulk-edge-calibrate \
            --data "$p0_dir/bulk-edge-calibration.zyx" \
            --output "$p0_dir/report.json" \
            --edge-count "$p0_edge_count" \
            --dataset-label "bulk-edge-p0-${P0_PROFILE}-v1" \
            --hardware-label "$P0_HARDWARE_LABEL" \
            --enforce-gates \
            --minimum-ingest-edges-per-second "$P0_MINIMUM_INGEST_EDGES_PER_SECOND" \
            --maximum-bytes-per-edge "$P0_MAXIMUM_BYTES_PER_EDGE" \
            --maximum-reopen-and-scan-ms "$P0_MAXIMUM_REOPEN_AND_SCAN_MS" \
            --maximum-peak-rss-bytes "$P0_MAXIMUM_PEAK_RSS_BYTES" \
            --maximum-scratch-candidate-segments "$P0_MAXIMUM_SCRATCH_CANDIDATE_SEGMENTS" \
            --minimum-scratch-source-runs "$P0_MINIMUM_SCRATCH_SOURCE_RUNS" \
            --minimum-scratch-merge-passes "$P0_MINIMUM_SCRATCH_MERGE_PASSES"
          python -c 'import json, sys; report = json.load(open(sys.argv[1], encoding="utf-8")); assert report["schema_version"] == 3 and report["storage"]["single_file"] and report["gate"]["enforced"] and report["gate"]["passed"]' "$p0_dir/report.json"
        shell: bash

      # This manifest records report hashes, declared labels, and the actual
      # repeat configuration. It deliberately classifies this run as CI smoke.
      - name: Collect native storage evidence manifest
        run: |
          collector_args=(
            --build-report "$ZYX_STAGE10_EVIDENCE_DIR/build-report.json"
            --query-report "$ZYX_STAGE10_EVIDENCE_DIR/query-report.json"
            --large-value-report "$ZYX_STAGE10_EVIDENCE_DIR/large-value-report.json"
            --bulk-edge-report "$ZYX_STAGE10_EVIDENCE_DIR/bulk-edge-report.json"
            --output "$ZYX_STAGE10_EVIDENCE_DIR/manifest.json"
            --recovery-repetitions 5
            --endurance-repetitions "$ZYX_STAGE10_ENDURANCE_REPETITIONS"
            --native-lifecycle-log "$ZYX_STAGE10_EVIDENCE_DIR/native-lifecycle.log"
            --recovery-maintenance-log "$ZYX_STAGE10_EVIDENCE_DIR/recovery-maintenance.log"
            --vector-smoke-data "$ZYX_STAGE10_EVIDENCE_DIR/vector-calibration.zyx"
            --large-value-smoke-data "$ZYX_STAGE10_EVIDENCE_DIR/large-value-calibration.zyx"
            --bulk-edge-smoke-data "$ZYX_STAGE10_EVIDENCE_DIR/bulk-edge-calibration.zyx"
          )
          if [ "$ZYX_STAGE10_ENDURANCE_REPETITIONS" -gt 0 ]; then
            collector_args+=(--endurance-log "$ZYX_STAGE10_EVIDENCE_DIR/endurance.log")
          fi
          python3 scripts/collect_native_storage_evidence.py "${collector_args[@]}"
        shell: bash

      - name: Upload Stage 10 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stage10-evidence-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stage10-evidence
          if-no-files-found: warn
          retention-days: 30

      - name: Generate Coverage Report
        if: runner.os == 'Linux'
        run: |
          python scripts/generate_coverage.py buildDir \
            --lcov coverage.lcov \
            --llvm-cov "${{ matrix.llvm_cov }}" \
            --llvm-prof "${{ matrix.llvm_profdata }}"
        shell: bash

      - name: Upload to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.lcov
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true


      - name: Collect diagnostic build metadata
        if: always()
        continue-on-error: true
        run: python scripts/collect_ci_environment.py --output "$RUNNER_TEMP/ci-evidence/environment.json" --build-dir buildDir --save-crash-symbols
        shell: bash

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Require diagnostic supervisor checks
        if: ${{ always() && steps.diagnostic_tests.outcome == 'failure' }}
        run: |
          echo 'Diagnostic supervisor checks failed; inspect diagnostic-tests evidence.'
          exit 1
        shell: bash
