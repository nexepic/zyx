name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: clang-20
            cxx: clang++-20
            llvm_cov: llvm-cov-20
            llvm_profdata: llvm-profdata-20
          - os: windows-latest
            cc: clang-cl
            cxx: clang-cl
            llvm_cov: llvm-cov
            llvm_profdata: llvm-profdata
          - os: macos-latest
            llvm_cov: llvm-cov
            llvm_profdata: llvm-profdata

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Common Tools
        run: pip install conan ninja

      - name: Install System Deps (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo apt-add-repository "deb http://apt.llvm.org/$(lsb_release -sc)/ llvm-toolchain-$(lsb_release -sc)-20 main"
          sudo apt update
          sudo apt install -y clang-20 llvm-20 libc++-20-dev libc++abi-20-dev

      - name: Install Project Dependencies (Conan) (Windows)
        if: runner.os == 'Windows'
        run: pwsh scripts/install_conan_windows.ps1 Debug

      - name: Install Project Dependencies (Conan) (Unix)
        if: runner.os != 'Windows'
        run: |
          conan profile detect
          conan install . --output-folder=buildDir --build=missing --build="antlr4-cppruntime/*" -s build_type=Debug -s compiler.cppstd=20
        env:
          CC: ${{ matrix.cc || '' }}
          CXX: ${{ matrix.cxx || '' }}

      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        run: choco install llvm --version=20.1.4 --force
        shell: pwsh

      - name: Configure and Build (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -S . -B buildDir -T ClangCL -DCMAKE_TOOLCHAIN_FILE=buildDir/conan_toolchain.cmake -DZYX_BUILD_TESTS=ON -DZYX_BUILD_APPS=ON -DZYX_ENABLE_COVERAGE=ON
          cmake --build buildDir --config Debug --target zyx_test_suite
        shell: pwsh

      - name: Configure and Build (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake -S . -B buildDir \
            -DCMAKE_TOOLCHAIN_FILE=buildDir/conan_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Debug \
            -DZYX_BUILD_TESTS=ON \
            -DZYX_BUILD_APPS=ON \
            -DZYX_ENABLE_COVERAGE=ON
          cmake --build buildDir --target zyx_test_suite
        shell: bash
        env:
          CC: ${{ matrix.cc || '' }}
          CXX: ${{ matrix.cxx || '' }}

      - name: Run Unit Tests
        run: |
          export LLVM_PROFILE_FILE="$PWD/buildDir/code-%p.profraw"
          ctest --test-dir buildDir --build-config Debug --output-on-failure
        shell: bash

      - name: Generate Coverage Report
        if: runner.os == 'Linux'
        run: |
          python scripts/generate_coverage.py buildDir \
            --lcov coverage.lcov \
            --llvm-cov "${{ matrix.llvm_cov }}" \
            --llvm-prof "${{ matrix.llvm_profdata }}"
        shell: bash

      - name: Upload to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.lcov
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true
