name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  verify-version:
    name: Verify version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Check tag matches CMake project version
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"
          TAG_VERSION="${TAG#v}"
          CMAKE_VERSION=$(python3 scripts/read_project_version.py)
          if [ "$TAG_VERSION" != "$CMAKE_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match CMake project version ($CMAKE_VERSION)"
            exit 1
          fi
          echo "Version consistent: $TAG_VERSION"

  release:
    name: Build on ${{ matrix.os }}
    needs: verify-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_tag: linux
            arch_tag: x86_64
            ext: tar.gz
            cc: clang-20
            cxx: clang++-20
          - os: macos-latest
            os_tag: macos
            arch_tag: arm64
            ext: tar.gz
          - os: windows-latest
            os_tag: windows
            arch_tag: x86_64
            ext: zip
            cc: clang-cl
            cxx: clang-cl

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Extract Version
        id: version
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Common Tools
        run: pip install conan ninja

      - name: Install System Deps (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo apt-add-repository "deb http://apt.llvm.org/$(lsb_release -sc)/ llvm-toolchain-$(lsb_release -sc)-20 main"
          sudo apt update
          sudo apt install -y clang-20 llvm-20 libc++-20-dev libc++abi-20-dev

      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install llvm --version=20.1.4 --force
          echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: Install Project Dependencies (Conan) (Windows)
        if: runner.os == 'Windows'
        run: pwsh scripts/install_conan_windows.ps1 Release -o with_tests=False

      - name: Install Project Dependencies (Conan) (Unix)
        if: runner.os != 'Windows'
        run: |
          conan profile detect
          conan install . --output-folder=buildDir --build=missing --build="antlr4-cppruntime/*" -s build_type=Release -s compiler.cppstd=20 -o with_tests=False
        env:
          CC: ${{ matrix.cc || '' }}
          CXX: ${{ matrix.cxx || '' }}

      - name: Configure, Build, and Install
        run: |
          cmake -S . -B buildDir -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=buildDir/conan_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DZYX_BUILD_TESTS=OFF \
            -DZYX_BUILD_APPS=ON \
            -DZYX_BUILD_PYTHON=OFF \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_INSTALL_PREFIX="$PWD/dist" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON
          cmake --build buildDir
          cmake --install buildDir
        shell: bash
        env:
          CC: ${{ matrix.cc || '' }}
          CXX: ${{ matrix.cxx || '' }}

      - name: Package CLI (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CLI_NAME="zyx-${VERSION}-${{ matrix.os_tag }}-${{ matrix.arch_tag }}.tar.gz"
          echo "cli_asset=$CLI_NAME" >> "$GITHUB_ENV"
          mkdir -p cli_package
          cp buildDir/zyx cli_package/
          tar -czf "$CLI_NAME" -C cli_package .

      - name: Package CLI (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CLI_NAME="zyx-${VERSION}-${{ matrix.os_tag }}-${{ matrix.arch_tag }}.zip"
          echo "cli_asset=$CLI_NAME" >> "$GITHUB_ENV"
          mkdir -p cli_package
          cp buildDir/zyx.exe cli_package/
          cd cli_package && 7z a -tzip "../$CLI_NAME" .

      - name: Package SDK (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SDK_NAME="zyx-sdk-${VERSION}-${{ matrix.os_tag }}-${{ matrix.arch_tag }}.tar.gz"
          echo "sdk_asset=$SDK_NAME" >> "$GITHUB_ENV"
          tar -czf "$SDK_NAME" -C dist .

      - name: Package SDK (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SDK_NAME="zyx-sdk-${VERSION}-${{ matrix.os_tag }}-${{ matrix.arch_tag }}.zip"
          echo "sdk_asset=$SDK_NAME" >> "$GITHUB_ENV"
          cd dist && 7z a -tzip "../$SDK_NAME" .

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.cli_asset }}
            ${{ env.sdk_asset }}

  update-homebrew:
    name: Update Homebrew Formula
    needs: [verify-version, release]
    runs-on: ubuntu-latest
    steps:
      - name: Update Formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [[ ! "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected release tag: $TAG"
            exit 1
          fi
          VERSION="${TAG#v}"
          TARBALL_URL="https://github.com/nexepic/zyx/archive/refs/tags/${TAG}.tar.gz"

          SHA256=$(curl -fsSL "$TARBALL_URL" | sha256sum | cut -d' ' -f1)

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/nexepic/homebrew-zyx.git"
          cd homebrew-zyx

          sed -i "s|url \".*\"|url \"${TARBALL_URL}\"|" Formula/zyx.rb
          sed -i "s|sha256 \".*\"|sha256 \"${SHA256}\"|" Formula/zyx.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/zyx.rb
          git commit -m "Update zyx to ${VERSION}"
          git push
