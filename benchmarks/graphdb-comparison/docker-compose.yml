services:
  neo4j:
    image: neo4j:5.26.0-community
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -a bolt://localhost:7687 -u neo4j -p password 'RETURN 1;' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 30s

  memgraph:
    image: memgraph/memgraph:2.22.0
    command: ["--also-log-to-stderr", "--log-level=WARNING"]
    ports:
      - "7688:7687"
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 1;' | mgconsole --host localhost --port 7687 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 10s

  runner:
    build:
      context: ../..
      dockerfile: benchmarks/graphdb-comparison/docker/zyx-bench.Dockerfile
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      MEMGRAPH_URI: bolt://memgraph:7687
      MEMGRAPH_USER: ""
      MEMGRAPH_PASSWORD: ""
      ZYX_COMPARE_BENCH: /usr/local/bin/zyx-compare-bench
    volumes:
      - ./results:/results
    depends_on:
      neo4j:
        condition: service_healthy
      memgraph:
        condition: service_healthy
