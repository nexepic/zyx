[package]
name = "zyxdb"
version = "0.1.25"
edition = "2021"
description = "Rust bindings for the ZYX embedded graph database"
license = "Apache-2.0"
repository = "https://github.com/nexepic/zyx"
homepage = "https://try-zyx.github.io/zyx"
documentation = "https://try-zyx.github.io/zyx/en/docs/zyx/api"
readme = "README.md"
keywords = ["graph", "database", "cypher", "embedded"]
categories = ["database"]

[features]
default = ["bundled"]
bundled = ["zyxdb-sys/bundled"]
system = ["zyxdb-sys/system"]

[dependencies]
zyxdb-sys = { path = "../zyxdb-sys", version = "0.1.25", default-features = false }

[dev-dependencies]
tempfile = "3"
