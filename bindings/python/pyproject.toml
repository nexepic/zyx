[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "zyxdb"
description = "Python bindings for ZYX graph database engine"
dynamic = ["version"]
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C++",
    "Topic :: Database",
    "Topic :: Database :: Database Engines/Servers",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://nexepic.github.io/zyx/"
Repository = "https://github.com/nexepic/zyx"
Documentation = "https://nexepic.github.io/zyx/"

[tool.scikit-build]
cmake.source-dir = "../.."
cmake.build-type = "Release"
wheel.packages = ["src/zyxdb"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "../../CMakeLists.txt"
regex = '''project\s*\(\s*zyx\b[\s\S]*?VERSION\s+(?P<value>\d+\.\d+\.\d+)'''

[tool.scikit-build.cmake.define]
ZYX_BUILD_TESTS = "OFF"
ZYX_BUILD_APPS = "OFF"
ZYX_BUILD_PYTHON = "ON"
